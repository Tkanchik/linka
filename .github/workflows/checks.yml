name: checks

on:
  push:
  pull_request:

jobs:
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax and ShellCheck
        run: bash qa/lint.sh
      - name: Regression
        run: bash qa/regression.sh
